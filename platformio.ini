; PlatformIO project for RRU7182M UHF RFID connectivity demo
; Target: Lonely Binary ESP32-S3-DevKitC-1 (N16R8: 16MB flash / 8MB PSRAM)

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
